<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body
    class="lavender-page"
    data-name="Shalini"
    data-person="person-3"
>

    <div id="confetti-container"></div>

    <div class="page">

        <header>
            <p class="small-title">A little something for you</p>
            <h1>A little letter for you 💜</h1>
            <p class="subtitle">Something beautiful is waiting inside.</p>
        </header>

        <main>

            <div class="envelope-area">

                <div class="envelope lavender-envelope" id="envelope">

                    <div class="letter">
                        <div class="letter-paper"></div>
                    </div>

                    <div class="envelope-back">

                        <div class="lavender-sprig sprig-left">
                            <span class="stem"></span>
                            <i></i>
                            <i></i>
                            <i></i>
                            <i></i>
                            <i></i>
                            <i></i>
                        </div>

                        <div class="lavender-sprig sprig-right">
                            <span class="stem"></span>
                            <i></i>
                            <i></i>
                            <i></i>
                            <i></i>
                            <i></i>
                            <i></i>
                        </div>

                        <div class="lavender-bundle bundle-left">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <div class="lavender-bundle bundle-right">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <span class="purple-dot dot-one"></span>
                        <span class="purple-dot dot-two"></span>
                        <span class="purple-dot dot-three"></span>

                        <span class="sparkle sparkle-one">✦</span>
                        <span class="sparkle sparkle-two">✧</span>

                    </div>

                    <div class="envelope-front"></div>

                    <div class="envelope-flap"></div>

                    <div class="name">
                        Dear <span id="personName"></span> ♡
                    </div>

                </div>

            </div>

            <button class="open-button" id="openButton">
                Open your envelope
            </button>

        </main>

    </div>

    <div class="puzzle-overlay" id="puzzleOverlay">

        <div class="puzzle-box">

            <button class="close-button" id="closePuzzle">×</button>

            <div class="lock">🔐</div>

            <h2>Before you open it...</h2>

            <p id="question"></p>

            <input
                type="text"
                id="answer"
                placeholder="Your answer"
                autocomplete="off"
            >

            <button class="unlock-button" id="unlockButton">
                Unlock Letter
            </button>

            <p class="message" id="message"></p>

        </div>

    </div>

    <script src="../script.js"></script>

</body>
</html>
